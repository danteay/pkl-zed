name = "Pkl"
grammar = "pkl"
path_suffixes = ["pkl", "pcf", "PklProject"]
first_line_pattern = '^#!.*\bpkl\b'
line_comments = ["// ", "/// "]
block_comment = ["/* ", " */"]
tab_size = 2
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
